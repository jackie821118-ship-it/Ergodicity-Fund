<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Ergodicity Fund</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://unpkg.com/recharts@2.12.7/umd/Recharts.js"></script>
  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
  <style>
    html, body, #root {
      background-color: #000 !important;
      margin: 0 !important;
      padding: 0 !important;
      width: 100%;
      min-height: 100vh;
      overflow-x: hidden;
    }
    * { box-sizing: border-box; }
    body {
      font-size: 16px;
      line-height: 1.4;
      -webkit-font-smoothing: antialiased;
    }
    main {
      max-width: 480px;
      margin: 0 auto;
    }
    @keyframes spin {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }
    .animate-spin { animation: spin 1s linear infinite; }
    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.5; }
    }
    .animate-pulse { animation: pulse 2s cubic-bezier(0.4,0,0.6,1) infinite; }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const {
      useState, useEffect, useCallback, useMemo
    } = React;

    const {
      LineChart, Line, XAxis, YAxis, CartesianGrid,
      Tooltip, ResponsiveContainer
    } = Recharts;

    // Lucide icons via UMD
    const createIcon = (name) => {
      return ({ className = "w-6 h-6", ...props }) => {
        const ref = React.useRef(null);
        React.useEffect(() => {
          if (ref.current && window.lucide) {
            ref.current.innerHTML = '';
            const svgStr = window.lucide.icons[name];
            if (svgStr) {
              const tmp = document.createElement('div');
              tmp.innerHTML = svgStr[2]; // SVG string
            }
          }
        }, []);
        // Fallback: render via lucide createIcons or inline SVG paths
        const iconPaths = {
          TrendingUp: 'M22 7 L13 16 9 12 2 19 M16 7 h6 v6',
          PieChart: 'M21.21 15.89A10 10 0 1 1 8 2.83 M22 12A10 10 0 0 0 12 2v10z',
          List: 'M8 6h13 M8 12h13 M8 18h13 M3 6h.01 M3 12h.01 M3 18h.01',
          History: 'M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8 M3 3v5h5 M12 7v5l4 2',
          Gift: 'M20 12v10H4V12 M2 7h20v5H2z M12 22V7 M12 7H7.5a2.5 2.5 0 0 1 0-5C11 2 12 7 12 7z M12 7h4.5a2.5 2.5 0 0 0 0-5C13 2 12 7 12 7z',
          RefreshCw: 'M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8 M21 3v5h-5 M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16 M8 16H3v5',
          AlertCircle: 'M12 22c5.523 0 10-4.477 10-10S17.523 2 12 2 2 6.477 2 12s4.477 10 10 10z M12 8v4 M12 16h.01',
          User: 'M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2 M12 3a4 4 0 1 0 0 8 4 4 0 0 0 0-8z',
          ChevronDown: 'M6 9l6 6 6-6',
          ChevronUp: 'M18 15l-6-6-6 6',
          Calendar: 'M8 2v4 M16 2v4 M3 10h18 M21 8H3a2 2 0 0 0-2 2v11a2 2 0 0 0 2 2h18a2 2 0 0 0 2-2V10a2 2 0 0 0-2-2z',
          BarChart3: 'M3 3v18h18 M18 17V9 M13 17V5 M8 17v-3',
        };
        const path = iconPaths[name] || '';
        return (
          <svg
            xmlns="http://www.w3.org/2000/svg"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            strokeWidth="2"
            strokeLinecap="round"
            strokeLinejoin="round"
            className={className}
            {...props}
          >
            {path.split(' M').map((d, i) => (
              <path key={i} d={i === 0 ? d : 'M' + d} />
            ))}
          </svg>
        );
      };
    };

    const TrendingUp = createIcon('TrendingUp');
    const PieChart = createIcon('PieChart');
    const List = createIcon('List');
    const History = createIcon('History');
    const Gift = createIcon('Gift');
    const RefreshCw = createIcon('RefreshCw');
    const AlertCircle = createIcon('AlertCircle');
    const User = createIcon('User');
    const ChevronDown = createIcon('ChevronDown');
    const ChevronUp = createIcon('ChevronUp');
    const Calendar = createIcon('Calendar');
    const BarChart3 = createIcon('BarChart3');

    const SPREADSHEET_ID = "1KbG0zxG2Nszrx7T5zXsobcueyP3L1_cfal0DKZ14CMw";

    const getValByKey = (obj, keyName) => {
      if (!obj) return "";
      if (obj[keyName] !== undefined) return obj[keyName];
      const cleanKey = (k) => k.replace(/\s/g, "").replace(/[\u200B-\u200D\uFEFF]/g, "");
      const targetKey = cleanKey(keyName);
      const foundKey = Object.keys(obj).find(
        (k) => cleanKey(k) === targetKey || cleanKey(k).includes(targetKey)
      );
      return foundKey ? obj[foundKey] : "";
    };

    const parseCSV = (text) => {
      const cleanText = text.replace(/^\uFEFF/, "");
      const lines = cleanText.split(/\r?\n/).filter((line) => line.trim() !== "");
      if (lines.length < 1) return [];
      const headers = lines[0].split(",").map((h) =>
        h.trim().replace(/"/g, "").replace(/[\u200B-\u200D\uFEFF]/g, "")
      );
      return lines.slice(1).map((line) => {
        const values = line
          .split(/,(?=(?:(?:[^"]*"){2})*[^"]*$)/)
          .map((v) => v.trim().replace(/"/g, ""));
        const obj = {};
        headers.forEach((header, i) => { obj[header] = values[i] || ""; });
        return obj;
      });
    };

    const NavButton = ({ active, onClick, icon, label }) => (
      <button
        onClick={onClick}
        className={`flex-1 flex flex-col items-center justify-center py-4 rounded-[28px] transition-all ${
          active ? "bg-blue-600 text-white scale-105 shadow-lg" : "text-zinc-500"
        }`}
      >
        {React.cloneElement(icon, { className: "w-6 h-6" })}
        <span className="text-[11px] font-bold mt-1 tracking-tight">{label}</span>
      </button>
    );

    const App = () => {
      const [activeTab, setActiveTab] = useState("summary");
      const [loading, setLoading] = useState(false);
      const [error, setError] = useState(null);
      const [selectedPerson, setSelectedPerson] = useState(null);
      const [expandedYears, setExpandedYears] = useState({});
      const [data, setData] = useState({ p1: [], p2: [], p3: [], p4: [], p5: [], p6: [] });

      const formatCurrency = (val) => {
        if (val === undefined || val === null || val === "") return "0";
        const cleanVal = String(val).replace(/,/g, "").replace("$", "").trim();
        const num = parseFloat(cleanVal);
        if (isNaN(num)) return "0";
        return num.toLocaleString("zh-TW");
      };

      const formatPercent = (val) => {
        if (!val) return "0.00%";
        const cleanVal = String(val).replace("%", "").replace("(", "").replace(")", "").trim();
        const num = parseFloat(cleanVal);
        if (isNaN(num)) return "0.00%";
        return (num >= 0 ? "+" : "") + num.toFixed(2) + "%";
      };

      const fetchSheetData = useCallback(async () => {
        setLoading(true);
        setError(null);
        const sheetConfig = [
          { key: "p1", gid: "0" },
          { key: "p2", tabName: "分頁2" },
          { key: "p3", tabName: "分頁3" },
          { key: "p4", tabName: "分頁4" },
          { key: "p5", tabName: "分頁5" },
          { key: "p6", tabName: "分頁6" },
        ];
        try {
          const newData = { p1: [], p2: [], p3: [], p4: [], p5: [], p6: [] };
          for (const config of sheetConfig) {
            const url = config.gid
              ? `https://docs.google.com/spreadsheets/d/${SPREADSHEET_ID}/export?format=csv&gid=${config.gid}`
              : `https://docs.google.com/spreadsheets/d/${SPREADSHEET_ID}/gviz/tq?tqx=out:csv&sheet=${encodeURIComponent(config.tabName)}`;
            const response = await fetch(url);
            if (!response.ok) throw new Error(`連線失敗 [${config.tabName || "分頁1"}]`);
            const text = await response.text();
            newData[config.key] = parseCSV(text);
          }
          setData(newData);
          if (newData.p3.length > 0) {
            const lastItem = newData.p3[newData.p3.length - 1];
            const lastYear = String(getValByKey(lastItem, "日期")).substring(0, 4);
            setExpandedYears({ [lastYear]: true });
          }
        } catch (err) {
          setError(err.message);
        } finally {
          setLoading(false);
        }
      }, []);

      useEffect(() => { fetchSheetData(); }, []);

      const latestSummary = useMemo(() => {
        if (!data.p1 || data.p1.length === 0) return null;
        return [...data.p1].sort((a, b) => new Date(getValByKey(b, "日期")) - new Date(getValByKey(a, "日期")))[0];
      }, [data.p1]);

      const latestBalance = useMemo(() => {
        if (!data.p3.length) return "0";
        return getValByKey(data.p3[data.p3.length - 1], "餘額");
      }, [data.p3]);

      const historyByYear = useMemo(() => {
        const groups = {};
        [...data.p3].reverse().forEach((item) => {
          const dateStr = String(getValByKey(item, "日期"));
          const year = dateStr.substring(0, 4) || "其他";
          if (!groups[year]) groups[year] = [];
          groups[year].push(item);
        });
        return groups;
      }, [data.p3]);

      const dividendGroups = useMemo(() => {
        const groups = {};
        data.p4.forEach((item) => {
          const name = getValByKey(item, "姓名");
          if (!name) return;
          if (!groups[name]) groups[name] = { items: [], total: 0, investment: 0 };
          const amount = parseFloat(String(getValByKey(item, "配發金額")).replace(/,/g, "")) || 0;
          groups[name].items.push(item);
          groups[name].total += amount;
        });
        data.p6.forEach((item) => {
          const name = getValByKey(item, "姓名");
          if (!name) return;
          if (!groups[name]) groups[name] = { items: [], total: 0, investment: 0 };
          const invAmount = parseFloat(String(getValByKey(item, "申購金額")).replace(/,/g, "")) || 0;
          groups[name].investment += invAmount;
        });
        return groups;
      }, [data.p4, data.p6]);

      const totalHistoricalProfit = useMemo(() => {
        return data.p5.reduce((acc, item) => {
          const profit = parseFloat(String(getValByKey(item, "損益")).replace(/,/g, "")) || 0;
          return acc + profit;
        }, 0);
      }, [data.p5]);

      const toggleYear = (year) => {
        setExpandedYears((prev) => ({ ...prev, [year]: !prev[year] }));
      };

      const renderContent = () => {
        if (loading && !data.p1.length)
          return (
            <div className="flex flex-col items-center justify-center h-[60vh]">
              <div style={{
                width: '40px', height: '40px',
                border: '4px solid rgba(59,130,246,0.2)',
                borderTopColor: '#3B82F6',
                borderRadius: '50%',
                animation: 'spin 1s linear infinite',
                marginBottom: '16px'
              }}></div>
              <p className="text-zinc-400 font-bold text-lg animate-pulse">正在抓取雲端數據...</p>
            </div>
          );

        if (error)
          return (
            <div className="p-8 bg-zinc-900 border border-red-500/20 rounded-[25px] flex flex-col items-center text-center space-y-4 mx-4">
              <AlertCircle className="w-10 h-10 text-red-500" />
              <h3 className="text-white font-bold text-xl">連線錯誤</h3>
              <p className="text-zinc-400 text-sm">{error}</p>
              <button onClick={fetchSheetData} className="w-full py-4 bg-white text-black rounded-xl font-bold text-lg">
                重新嘗試
              </button>
            </div>
          );

        switch (activeTab) {
          case "summary": {
            if (!latestSummary)
              return (
                <div className="p-8 bg-zinc-900 border border-zinc-800 rounded-[25px] text-center">
                  <p className="text-zinc-500 font-bold text-lg">目前無績效資料</p>
                </div>
              );
            const profit = getValByKey(latestSummary, "總損益");
            const isProfitPos = parseFloat(String(profit).replace(/,/g, "")) >= 0;
            return (
              <div className="space-y-4 px-1 pb-10">
                <div className="bg-zinc-900 p-6 rounded-[30px] border border-zinc-800 shadow-lg">
                  <p className="text-zinc-300 text-lg font-black mb-2 uppercase tracking-widest">
                    本季損益 ({getValByKey(latestSummary, "日期") || "今日"})
                  </p>
                  <h2 className={`text-5xl font-black tracking-tighter ${isProfitPos ? "text-red-500" : "text-green-500"}`}>
                    {isProfitPos ? "+" : ""}{formatCurrency(profit)}
                  </h2>
                </div>

                <div className="bg-zinc-900 p-6 rounded-[30px] border border-zinc-800 shadow-lg">
                  <h3 className="text-lg font-black flex items-center gap-2 text-white mb-4 uppercase tracking-widest">
                    <TrendingUp className="w-6 h-6 text-blue-500" /> 本季績效趨勢
                  </h3>
                  <div className="h-56 w-full">
                    <ResponsiveContainer width="100%" height="100%">
                      <LineChart data={data.p1}>
                        <CartesianGrid strokeDasharray="3 3" stroke="#222" vertical={false} />
                        <XAxis dataKey={(d) => getValByKey(d, "日期")} hide />
                        <YAxis stroke="#71717a" fontSize={11} fontWeight="700" tickFormatter={(v) => formatCurrency(v)} width={45} />
                        <Tooltip
                          contentStyle={{ backgroundColor: "#000", border: "1px solid #333", borderRadius: "12px", fontSize: "13px", fontWeight: "bold" }}
                          formatter={(val) => [formatCurrency(val), "總損益"]}
                          labelFormatter={(label) => `日期: ${label}`}
                        />
                        <Line
                          type="monotone"
                          dataKey={(d) => parseFloat(String(getValByKey(d, "總損益")).replace(/,/g, "")) || 0}
                          stroke="#3B82F6" strokeWidth={3} dot={false}
                        />
                      </LineChart>
                    </ResponsiveContainer>
                  </div>
                </div>

                <div className="bg-zinc-900 p-6 rounded-[30px] border border-zinc-800 shadow-lg">
                  <div className="flex justify-between items-start mb-5">
                    <h3 className="text-lg font-black flex items-center gap-2 text-white uppercase tracking-widest mt-1">
                      <BarChart3 className="w-6 h-6 text-yellow-500" /> 歷年投資績效
                    </h3>
                    <div className="text-right">
                      <p className="text-[10px] text-zinc-500 font-black uppercase tracking-tighter mb-0.5">歷年損益合計（不含稅費）</p>
                      <p className={`text-2xl font-black leading-none ${totalHistoricalProfit >= 0 ? "text-red-500" : "text-green-500"}`}>
                        {totalHistoricalProfit >= 0 ? "+" : ""}{formatCurrency(totalHistoricalProfit)}
                      </p>
                    </div>
                  </div>
                  <div className="space-y-3">
                    {data.p5.length > 0 ? data.p5.map((item, idx) => {
                      const quarter = getValByKey(item, "季度");
                      if (!quarter) return null;
                      const qProfit = getValByKey(item, "損益");
                      const qRate = getValByKey(item, "報酬率") || getValByKey(item, "損益(%)");
                      const isPos = parseFloat(String(qProfit).replace(/,/g, "")) >= 0;
                      return (
                        <div key={idx} className="flex justify-between items-center bg-black/30 p-4 rounded-[20px] border border-zinc-800/50">
                          <span className="text-white font-black text-lg leading-none">{quarter}</span>
                          <div className="text-right">
                            <p className={`text-xl font-black ${isPos ? "text-red-500" : "text-green-500"}`}>
                              {isPos ? "+" : ""}{formatCurrency(qProfit)}
                              <span className="text-xs ml-1 opacity-80 font-bold">({formatPercent(qRate)})</span>
                            </p>
                          </div>
                        </div>
                      );
                    }) : (
                      <p className="text-zinc-600 text-sm font-bold text-center py-4 italic">尚未載入歷年數據</p>
                    )}
                  </div>
                </div>
              </div>
            );
          }

          case "holdings":
            return (
              <div className="px-1 space-y-2">
                {data.p2.map((stock, idx) => {
                  const name = getValByKey(stock, "股票名稱") || getValByKey(stock, "股票");
                  if (!name) return null;
                  const code = getValByKey(stock, "股票代號") || getValByKey(stock, "代號");
                  const price = getValByKey(stock, "收盤價");
                  const change = getValByKey(stock, "漲跌");
                  const profitValue = getValByKey(stock, "損益");
                  const profitRate = getValByKey(stock, "報酬率") || getValByKey(stock, "損益(%)");
                  const isProfitPos = parseFloat(String(profitValue).replace(/,/g, "")) >= 0;
                  const isPricePos = parseFloat(String(change).replace(/,/g, "")) >= 0;
                  return (
                    <div key={idx} className="bg-zinc-900 border border-zinc-800 px-5 py-4 rounded-[22px] flex items-center justify-between shadow-sm">
                      <div className="flex-1 min-w-0 pr-2">
                        <div className="flex items-center gap-1.5 mb-0.5">
                          <span className="text-zinc-100 font-bold text-lg truncate">{name}</span>
                          <span className="text-zinc-500 text-xs font-bold">({code})</span>
                        </div>
                        <div className="flex items-center gap-2">
                          <span className="text-zinc-300 text-base font-bold">{formatCurrency(price)}</span>
                          <span className={`text-xs font-bold ${isPricePos ? "text-red-500" : "text-green-500"}`}>
                            {isPricePos ? "▲" : "▼"} {Math.abs(change)}
                          </span>
                        </div>
                      </div>
                      <div className="text-right">
                        <p className={`text-lg font-black leading-tight ${isProfitPos ? "text-red-500" : "text-green-500"}`}>
                          {isProfitPos ? "+" : ""}{formatCurrency(profitValue)}
                        </p>
                        <p className={`text-xs font-bold ${isProfitPos ? "text-red-500" : "text-green-500"}`}>
                          {formatPercent(profitRate)}
                        </p>
                      </div>
                    </div>
                  );
                })}
              </div>
            );

          case "history":
            return (
              <div className="space-y-4 px-1">
                <div className="bg-zinc-900 px-6 py-7 rounded-[28px] border border-zinc-800 flex justify-between items-center shadow-lg">
                  <h3 className="text-zinc-200 font-black text-lg uppercase tracking-widest">帳戶餘額</h3>
                  <span className="text-blue-500 font-black text-3xl tracking-tighter">${formatCurrency(latestBalance)}</span>
                </div>
                <div className="space-y-3">
                  {Object.keys(historyByYear).sort((a, b) => b - a).map((year) => (
                    <div key={year} className="bg-zinc-900 border border-zinc-800 rounded-[28px] overflow-hidden shadow-md">
                      <button onClick={() => toggleYear(year)} className="w-full px-6 py-4 flex justify-between items-center active:bg-zinc-800 transition-colors">
                        <div className="flex items-center gap-3">
                          <Calendar className="w-5 h-5 text-zinc-500" />
                          <span className="text-white font-black text-lg">{year} 年度</span>
                        </div>
                        <div className="flex items-center gap-2">
                          <span className="text-zinc-500 text-xs font-bold">{historyByYear[year].length} 筆資料</span>
                          {expandedYears[year] ? <ChevronUp className="w-5 h-5 text-zinc-600" /> : <ChevronDown className="w-5 h-5 text-zinc-600" />}
                        </div>
                      </button>
                      {expandedYears[year] && (
                        <div className="divide-y divide-zinc-800/50 border-t border-zinc-800">
                          {historyByYear[year].map((item, idx) => {
                            const amount = parseFloat(String(getValByKey(item, "金額")).replace(/,/g, "")) || 0;
                            const note = getValByKey(item, "備註");
                            return (
                              <div key={idx} className="px-6 py-4 flex justify-between items-center">
                                <div className="flex flex-col flex-1 min-w-0 pr-3">
                                  <span className="text-zinc-500 text-[10px] font-bold mb-0.5">{getValByKey(item, "日期")}</span>
                                  <p className="text-zinc-100 text-base font-bold leading-tight truncate">
                                    {getValByKey(item, "項目")}
                                    {note && <span className="ml-1 text-zinc-500 text-sm font-medium">({note})</span>}
                                  </p>
                                </div>
                                <div className="text-right whitespace-nowrap">
                                  <p className={`text-lg font-black ${amount >= 0 ? "text-red-500" : "text-green-500"}`}>
                                    {amount >= 0 ? "+" : ""}{formatCurrency(amount)}
                                  </p>
                                  <p className="text-zinc-600 text-[10px] font-bold uppercase">
                                    餘額: {formatCurrency(getValByKey(item, "餘額"))}
                                  </p>
                                </div>
                              </div>
                            );
                          })}
                        </div>
                      )}
                    </div>
                  ))}
                </div>
              </div>
            );

          case "dividends":
            return (
              <div className="space-y-4 px-1">
                {Object.keys(dividendGroups).map((name) => {
                  const group = dividendGroups[name];
                  const recoveryRate = group.investment > 0 ? (group.total / group.investment) * 100 : 0;
                  return (
                    <div key={name} className="bg-zinc-900 border border-zinc-800 rounded-[28px] overflow-hidden shadow-lg">
                      <button
                        onClick={() => setSelectedPerson(selectedPerson === name ? null : name)}
                        className="w-full p-6 flex justify-between items-center active:bg-zinc-800"
                      >
                        <div className="flex items-center gap-4">
                          <div className="w-11 h-11 bg-blue-500/10 rounded-full flex items-center justify-center border border-blue-500/20">
                            <User className="text-blue-500 w-6 h-6" />
                          </div>
                          <div className="text-left">
                            <h4 className="text-xl font-bold text-white leading-tight">{name}</h4>
                            <div className="mt-1 flex items-baseline gap-1 flex-wrap">
                              <span className="text-zinc-300 text-sm font-bold">累積股息：</span>
                              <span className="text-red-500 text-lg font-black">${formatCurrency(group.total)}</span>
                              <span className="text-red-500 text-sm font-bold ml-1">({recoveryRate.toFixed(0)}%)</span>
                            </div>
                            <p className="text-zinc-500 text-xs font-bold mt-0.5">申購金額：${formatCurrency(group.investment)}</p>
                          </div>
                        </div>
                        {selectedPerson === name ? <ChevronUp className="w-6 h-6 text-zinc-600" /> : <ChevronDown className="w-6 h-6 text-zinc-600" />}
                      </button>
                      {selectedPerson === name && (
                        <div className="px-6 pb-6 space-y-2.5">
                          <div className="h-px bg-zinc-800 mb-3" />
                          {group.items.map((record, rIdx) => (
                            <div key={rIdx} className="bg-black/30 p-4 rounded-[18px] flex justify-between items-center border border-zinc-800/20">
                              <span className="text-white text-sm font-bold">
                                {getValByKey(record, "年度")} {getValByKey(record, "項目")}
                              </span>
                              <span className="text-xl font-black text-yellow-500">
                                ${formatCurrency(getValByKey(record, "配發金額"))}
                              </span>
                            </div>
                          ))}
                        </div>
                      )}
                    </div>
                  );
                })}
              </div>
            );

          default:
            return null;
        }
      };

      return (
        <div className="min-h-screen bg-black text-zinc-100 pb-40">
          <header className="p-8 pb-6 flex justify-between items-center sticky top-0 bg-black/90 backdrop-blur-xl z-50 border-b border-zinc-900">
            <div>
              <h1 className="text-4xl font-black tracking-tighter text-white uppercase italic leading-none">
                Ergodicity Fund
              </h1>
              <p className="text-[10px] text-zinc-600 font-black tracking-[0.3em] uppercase mt-2">
                Mobile Insight V5.2
              </p>
            </div>
            <button
              onClick={fetchSheetData}
              className="p-4 bg-zinc-900 border border-zinc-800 rounded-2xl transition-all"
              disabled={loading}
            >
              <RefreshCw className={`w-6 h-6 text-blue-500 ${loading ? "animate-spin" : ""}`} />
            </button>
          </header>

          <main className="px-3 pt-6">{renderContent()}</main>

          <nav className="fixed bottom-8 left-4 right-4 z-50">
            <div className="max-w-md mx-auto bg-zinc-900/95 backdrop-blur-2xl border border-zinc-800 rounded-[38px] p-2 flex justify-between shadow-2xl">
              <NavButton active={activeTab === "summary"} onClick={() => setActiveTab("summary")} icon={<PieChart />} label="總覽" />
              <NavButton active={activeTab === "holdings"} onClick={() => setActiveTab("holdings")} icon={<List />} label="持股" />
              <NavButton active={activeTab === "history"} onClick={() => setActiveTab("history")} icon={<History />} label="帳務" />
              <NavButton active={activeTab === "dividends"} onClick={() => setActiveTab("dividends")} icon={<Gift />} label="收益" />
            </div>
          </nav>
        </div>
      );
    };

    const root = ReactDOM.createRoot(document.getElementById("root"));
    root.render(<App />);
  </script>
</body>
</html>
